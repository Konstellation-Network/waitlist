services:
  db:
    image: postgres:17-alpine
    container_name: konstellation_waitlist_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: konstellation
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: waitlist
    ports:
      - "5433:5432"
    volumes:
      - waitlist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U konstellation -d waitlist"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  waitlist_pgdata:
